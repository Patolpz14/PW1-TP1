<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocablo - Perfil de Usuario</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/perfil.css">
</head>

<body>

    <!-- NAVEGACIÓN SUPERIOR -->
    <header class="cabecera-dashboard">
        <nav class="nav-principal">
            <a href="dashboard.html" class="logo">
                <img src="img/logo-vocablo.svg" alt="Logotipo de Vocablo">
            </a>
            <ul class="menu-usuario">
                <li><a href="dashboard.html">Mis Cursos</a></li>
                <li><a href="perfil.html" class="activo">Mi Perfil</a></li>
                <li><a href="ranking.html">Ranking</a></li>
                <li><a href="index.html">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="contenedor-perfil">
        <h1 class="titulo-pagina">Mi Perfil</h1>

        <div class="layout-perfil">

            <!-- COLUMNA IZQUIERDA: Tarjeta de Identidad y Logros -->
            <aside class="tarjeta-identidad">
                <img src="img/avatar-generico.jpg" alt="Foto de perfil de Juan Pérez" class="avatar-usuario">
                <h2>Juan Pérez</h2>
                <p class="usuario-arroba">@juanperez_web</p>
                <p class="fecha-miembro">Miembro desde Marzo 2026</p>

                <!-- Resumen de Logros Académicos Semántico -->
                <ul class="logros-academicos">
                    <li class="logro">
                        <span class="logro-icono">🏆</span>
                        <span class="logro-texto">1200 XP</span>
                    </li>
                    <li class="logro">
                        <span class="logro-icono">🔥</span>
                        <span class="logro-texto">14 Días</span>
                    </li>
                </ul>
            </aside>

            <!-- COLUMNA DERECHA: Ajustes y Formulario -->
            <section class="tarjeta-ajustes">

                <div class="info-email">
                    <strong>Email registrado:</strong>
                    <span>juan.perez@alumnos.unlam.edu.ar</span>
                </div>

                <hr class="separador">

                <!-- Formulario de actualización -->
                <form action="perfil.html" method="POST" class="formulario-ajustes">

                    <h3>Cambiar Contraseña</h3>

                    <div class="grupo-input">
                        <label for="pass-actual">Contraseña actual</label>
                        <input type="password" id="pass-actual" name="pass-actual" required>
                    </div>

                    <div class="grupo-input">
                        <label for="pass-nueva">Nueva contraseña</label>
                        <input type="password" id="pass-nueva" name="pass-nueva" required>
                    </div>

                    <div class="grupo-input">
                        <label for="pass-confirma">Confirmar contraseña</label>
                        <input type="password" id="pass-confirma" name="pass-confirma" required>
                    </div>

                    <hr class="separador">

                    <h3>Preferencias</h3>

                    <div class="grupo-input">
                        <label for="idioma-interfaz">Idioma principal de interfaz</label>
                        <select id="idioma-interfaz" name="idioma-interfaz">
                            <option value="es" selected>Español</option>
                            <option value="en">English</option>
                            <option value="pt">Português</option>
                        </select>
                    </div>

                    <!-- Botonera -->
                    <div class="acciones-perfil">
                        <button type="submit" class="btn-primario">Guardar Cambios</button>
                    </div>
                </form>

            </section>

        </div>
    </main>

</body>

</html>
