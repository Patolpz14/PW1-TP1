<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocablo - Mi Panel</title>

    <!-- CSS Modular: Orden de cascada -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <!-- NAVEGACIÓN SUPERIOR -->
    <header class="cabecera-dashboard">
        <nav class="nav-principal">
            <a href="dashboard.html" class="logo">
                <img src="img/logo-vocablo.svg" alt="Logotipo de Vocablo">
            </a>
            <ul class="menu-usuario">
                <li><a href="dashboard.html" class="activo">Mis Cursos</a></li>
                <li><a href="perfil.html">Mi Perfil</a></li>
                <li><a href="ranking.html">Ranking</a></li>
                <li><a href="index.html">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTENEDOR PRINCIPAL DEL DASHBOARD -->
    <main class="contenedor-dashboard">

        <!-- SECCIÓN DE IDIOMAS -->
        <section class="cursos-activos">
            <h2>Tus Idiomas</h2>

            <div class="grilla-cursos">
                <article class="tarjeta-curso">
                    <h3>Inglés</h3>
                    <p>Nivel Básico - 20% completado</p>
                    <a href="curso-ingles.html" class="btn-primario">Continuar</a>
                </article>

                <article class="tarjeta-curso">
                    <h3>Alemán</h3>
                    <p>Nivel Inicial - 5% completado</p>
                    <a href="curso-aleman.html" class="btn-primario">Continuar</a>
                </article>

                <article class="tarjeta-curso">
                    <h3>Chino</h3>
                    <p>Nivel Inicial - 0% completado</p>
                    <a href="curso-chino.html" class="btn-primario">Comenzar</a>
                </article>
            </div>
        </section>

        <!-- PANEL LATERAL DE ESTADÍSTICAS -->
        <aside class="panel-estadisticas">
            <h2>Tu Progreso</h2>
            <ul class="lista-estadisticas">
                <li><strong>Racha:</strong> 3 días 🔥</li>
                <li><strong>Experiencia:</strong> 450 XP ⭐️</li>
                <li><strong>Liga:</strong> Bronce 🥉</li>
            </ul>
        </aside>

    </main>

</body>

</html>
