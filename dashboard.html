<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocablo - Mi Panel de Aprendizaje</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <!-- NAVEGACIÓN SUPERIOR MODERNA -->
    <header class="cabecera-dashboard">
        <nav class="nav-principal">
            <a href="dashboard.html" class="logo">
                <span class="logo-icono">🌐</span> <strong>Vocablo</strong>
            </a>

            <!-- BUSCADOR / MENÚ DESPLEGABLE CON DETAILS -->
            <details class="buscador-cursos">
                <summary>
                    🔍 Encontrá un curso...
                </summary>
                <ul class="lista-cursos">
                    <li>
                        <a href="curso-ingles.html">
                            <span>Inglés</span>
                            <img src="img/reino-unido.png" alt="Bandera UK">
                        </a>
                    </li>
                    <li>
                        <a href="curso-aleman.html">
                            <span>Alemán</span>
                            <img src="img/alemania.png" alt="Bandera Alemania">
                        </a>
                    </li>
                    <li>
                        <a href="curso-chino.html">
                            <span>Chino</span>
                            <img src="img/china.png" alt="Bandera China">
                        </a>
                    </li>
                    <li>
                        <a href="curso-coreano.html">
                            <span>Coreano</span>
                            <img src="img/corea-del-sur.png" alt="Bandera Corea">
                        </a>
                    </li>
                </ul>
            </details>

            <!-- MENÚ DE USUARIO -->
            <ul class="menu-usuario">
                <li><a href="dashboard.html" class="activo">Mis Cursos</a></li>
                <li><a href="perfil.html">Mi Perfil</a></li>
                <li><a href="ranking.html">Ranking</a></li>
                <li><button id="btn-cerrar-sesion" class="btn-salir">Cerrar Sesión</button></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-dashboard">

        <!-- BIENVENIDA DINÁMICA -->
        <section class="banner-bienvenida">
            <div class="saludo-box">
                <h1>¡Hola, <span id="nombre-usuario">Estudiante</span>! 👋</h1>
                <p>Estás a un paso de dominar un nuevo idioma. ¡Elige tu curso y comienza hoy!</p>
            </div>
        </section>

        <!-- SECCIÓN DE IDIOMAS (Se llena con JS según el usuario nuevo) -->
        <section class="cursos-activos">
            <h2>Tus Idiomas</h2>
            <div id="grilla-cursos" class="grilla-cursos">
                <!-- El JavaScript cargará las tarjetas con 0% aquí -->
            </div>
        </section>

        <!-- PANEL LATERAL DE ESTADÍSTICAS -->
        <aside class="panel-estadisticas">
            <h2>Tus Estadísticas</h2>
            <ul id="lista-estadisticas" class="lista-estadisticas">
                <!-- El JavaScript cargará las estadísticas iniciales aquí -->
            </ul>
        </aside>

    </main>

    <!-- Script del Dashboard -->
    <script type="module" src="js/dashboard.js"></script>
</body>

</html>
