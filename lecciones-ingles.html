<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocablo - Lección de Inglés</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/lecciones.css">
</head>

<body>

    <!-- CABECERA DE LA LECCIÓN -->
    <header class="cabecera-leccion">
        <nav class="nav-leccion">

            <a href="dashboard.html" class="btn-secundario" aria-label="Cerrar lección">✖ Salir</a>

            <div class="contenedor-progreso">
                <div class="progreso-actual" style="width: 50%;"></div> <!-- como se hace la barra de progreso?  -->
            </div>

            <span class="vidas-restantes" aria-label="3 vidas restantes">❤️ 3</span>
        </nav>
    </header>

    <!-- CONTENEDOR PRINCIPAL: EL EJERCICIO -->
    <main class="contenedor-principal-leccion">

        <section class="area-ejercicio">
            <h2>¿Cómo se dice "Hola"?</h2>

            <!-- Formulario de validación estática -->
            <!-- Agregamos un ID para atraparlo con JavaScript -->
            <form id="form-leccion" data-id-leccion="ingles-unidad1-ej1" class="formulario-leccion">

                <fieldset class="grupo-opciones">
                    <legend class="oculto-visual">Selecciona la traducción correcta</legend>

                    <label class="tarjeta-opcion">
                        <!-- Cambiamos el value por la respuesta real -->
                        <input type="radio" name="traduccion" value="hello" required>
                        <span class="texto-opcion">Hello</span>
                    </label>

                    <label class="tarjeta-opcion">
                        <input type="radio" name="traduccion" value="goodbye" required>
                        <span class="texto-opcion">Goodbye</span>
                    </label>

                    <label class="tarjeta-opcion">
                        <input type="radio" name="traduccion" value="please" required>
                        <span class="texto-opcion">Please</span>
                    </label>
                </fieldset>

                <footer class="controles-leccion">
                    <button type="submit" class="btn-primario">Comprobar respuesta</button>
                    <!-- Agregamos un párrafo vacío para inyectar mensajes de éxito/error desde JS -->
                    <p id="mensaje-feedback" class="mensaje-oculto"></p>
                </footer>
            </form>

        </section>

    </main>

    <script type="module" src="js/views/leccion.js"></script>

</body>

</html>
