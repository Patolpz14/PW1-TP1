<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocablo - Ranking</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/ranking.css">
</head>

<body>

    <!-- NAVEGACIÓN SUPERIOR -->
    <header class="cabecera-dashboard">
        <nav class="nav-principal">
            <a href="dashboard.html" class="logo">
                <img src="../img/logo-vocablo.svg" alt="Logotipo de Vocablo">
            </a>
            <ul class="menu-usuario">
                <li><a href="dashboard.html">Mis Cursos</a></li>
                <li><a href="perfil.html">Mi Perfil</a></li>
                <li><a href="ranking.html" class="activo">Ranking</a></li>
                <li><a href="tienda.html">Tienda</a></li>
                <li><button id="btn-cerrar-sesion" class="btn-salir">Cerrar Sesión</button></li>
            </ul>
        </nav>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="contenedor-ranking">

        <!-- SELECTOR DE LIGA -->
        <div class="controles-ranking">
            <label for="selector-liga">Liga actual:</label>
            <select id="selector-liga" name="liga">
                <option value="bronce" selected>Liga de Bronce</option>
                <option value="plata">Liga de Plata</option>
                <option value="oro">Liga de Oro</option>
            </select>
        </div>

        <!-- BANNER DE LIGA -->
        <header class="banner-liga">
            <h1 id="titulo-liga">🏆 Tabla de Clasificación - Liga de Bronce</h1>
            <p>El ranking se ordena por XP total. Tu liga depende de la XP acumulada.</p>
        </header>

        <!-- TABLA DE POSICIONES (DINÁMICA) -->
        <section class="contenedor-tabla">
            <table class="tabla-ranking">
                <thead>
                    <tr>
                        <th>Puesto</th>
                        <th>Estudiante</th>
                        <th>XP total</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-ranking">
                    <!-- Las filas se inyectarán dinámicamente mediante JavaScript -->
                </tbody>
            </table>
        </section>

    </main>

    <!-- Script del Ranking como Módulo -->
    <script type="module" src="../js/views/ranking.js"></script>
</body>

</html>
