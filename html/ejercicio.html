<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocablo - Lección en curso</title>
    <!-- Mantené la ruta a tu archivo CSS actual -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/lecciones.css">
</head>

<body>
    <!-- Barra superior de la lección (basada en tu diseño) -->
    <header class="header-leccion">
        <a href="#" id="btn-salir" class="btn-salir">✖ Salir</a>
        <div class="barra-progreso-fondo">
            <div id="barra-progreso-activa" class="barra-progreso-nivel" style="width: 0%;"></div>
        </div>
        <div class="vidas-contenedor">
            <span id="contador-vidas">❤️❤️❤️ 3</span>
        </div>
    </header>

    <main class="contenedor-principal-leccion">
        <section class="area-ejercicio">

            <!-- 1. El título dinámico -->
            <h2 id="titulo-pregunta">Cargando ejercicio...</h2>

            <form id="form-leccion" class="formulario-leccion">

                <!-- 2. El contenedor vacío donde JS dibujará las opciones o el input de texto -->
                <fieldset class="grupo-opciones" id="contenedor-opciones">
                    <!-- JS inyectará el contenido aquí -->
                </fieldset>

                <!-- 3. Los controles inferiores -->
                <footer class="controles-leccion">
                    <button type="submit" id="btn-comprobar" class="btn-primario">Comprobar respuesta</button>
                    <p id="mensaje-feedback" class="mensaje-oculto"></p>
                </footer>
            </form>

        </section>
    </main>

    <!-- Conectamos el motor dinámico -->
    <script type="module" src="../js/views/leccion.js"></script>
</body>

</html>
