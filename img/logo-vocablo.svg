<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="220" height="50">
    <!-- Definición de gradientes de color -->
    <defs>
        <linearGradient id="gradAzul" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa" />
            <stop offset="100%" stop-color="#2563eb" />
        </linearGradient>
        <linearGradient id="gradNaranja" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#d97706" />
        </linearGradient>
    </defs>

    <!-- Ícono: Burbujas de diálogo solapadas -->
    <g transform="translate(5, 5)">
        <!-- Burbuja de atrás (Naranja) -->
        <path d="M28,8 C40,8 50,16 50,26 C50,31 48,36 44,39 L48,46 L39,43 C36,45 32,46 28,46 C16,46 6,38 6,26 C6,16 16,8 28,8 Z" fill="url(#gradNaranja)" opacity="0.95"/>
        
        <!-- Burbuja de adelante (Azul) -->
        <path d="M20,0 C32,0 42,8 42,18 C42,23 40,28 36,31 L40,38 L31,35 C28,37 24,38 20,38 C8,38 -2,30 -2,18 C-2,8 8,0 20,0 Z" fill="url(#gradAzul)"/>
        
        <!-- Puntos suspensivos (Comunicación) -->
        <circle cx="10" cy="19" r="2.5" fill="#ffffff" />
        <circle cx="20" cy="19" r="2.5" fill="#ffffff" />
        <circle cx="30" cy="19" r="2.5" fill="#ffffff" />
    </g>

    <!-- Tipografía -->
    <text x="65" y="38" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="900" fill="#1f2937" letter-spacing="-0.5">Vocablo</text>
    
    <!-- Punto de acento final -->
    <circle cx="188" cy="38" r="4" fill="#2563eb" />
</svg>
