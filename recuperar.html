<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocablo - Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/recuperar.css">
</head>

<body>

    <header class="cabecera-principal">
        <img src="img/logo-vocablo.svg" alt="Logotipo de Vocablo">
        <p>Aprende Inglés, Alemán, Chino y Coreano gratis y de forma divertida</p>
    </header>

    <main class="contenedor-principal">
        <section class="tarjeta-recuperar">
            <h2>Restablecer Contraseña</h2>
            <p class="texto-instrucciones">
                Ingresa tu correo registrado y tu nueva contraseña (de 8 a 15 caracteres, con una mayúscula y un
                carácter especial).
            </p>

            <!-- Formulario limpio sin action ni method, controlado por JS -->
            <form id="form-recuperar" class="formulario-recuperar">

                <label for="email-recuperar">
                    <span>Correo electrónico:</span>
                    <input type="email" id="email-recuperar" name="email" placeholder="usuario@ejemplo.com" required>
                </label>

                <label for="pass-nueva">
                    <span>Nueva contraseña:</span>
                    <input type="password" id="pass-nueva" name="nuevaPassword" placeholder="********" required>
                </label>

                <label for="pass-confirma">
                    <span>Confirmar nueva contraseña:</span>
                    <input type="password" id="pass-confirma" name="confirmaPassword" placeholder="********" required>
                </label>

                <button type="submit" class="btn-primario">Actualizar Contraseña</button>
            </form>

            <nav class="enlaces-secundarios">
                <a href="index.html">← Volver al inicio de sesión</a>
            </nav>
        </section>
    </main>

    <!-- Script exclusivo para recuperación -->
    <script type="module" src="js/recuperar.js"></script>
</body>

</html>
