<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocablo - Crear Cuenta</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <header class="cabecera-principal">
        <img src="img/logo-vocablo.svg" alt="Logotipo de Vocablo">
        <p>Aprende Inglés, Alemán, Chino y Coreano gratis y de forma divertida</p>
    </header>

    <main class="contenedor-principal">
        <section class="tarjeta-login">
            <h2>Crea tu cuenta</h2>

            <form action="dashboard.html" method="POST" class="formulario-login">
                <label for="nombre">
                    <span>Nombre completo:</span>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
                </label>

                <label for="email">
                    <span>Correo electrónico:</span>
                    <input type="email" id="email" name="email" placeholder="usuario@ejemplo.com" required>
                </label>

                <label for="password">
                    <span>Contraseña:</span>
                    <input type="password" id="password" name="password" placeholder="********" required>
                </label>

                <button type="submit" class="btn-primario">Registrarme</button>
            </form>

            <nav class="enlaces-secundarios">
                <a href="index.html">¿Ya tienes cuenta? Inicia sesión aquí</a>
            </nav>
        </section>
    </main>

</body>

</html>
