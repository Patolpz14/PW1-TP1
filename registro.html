<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocablo - Crear Cuenta</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/crearCuenta.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <header class="cabecera-principal">
        <img src="img/logo-vocablo.svg" alt="Logotipo de Vocablo">
        <p>Aprende Inglés, Alemán, Chino y Coreano gratis y de forma divertida</p>
    </header>

    <main class="contenedor-principal">
        <section class="tarjeta-login">

            <form class="formulario-registro">
                <h2>Crear Cuenta en Vocablo</h2>

                <div class="campo-formulario">
                    <label for="nombre">Nombre de usuario</label>
                    <input type="text" id="nombre" placeholder="Tu nombre">
                    <span id="error-nombre" class="error-texto"></span>
                </div>

                <div class="campo-formulario">
                    <label for="usuario">Correo Electronico</label>
                    <input type="text" id="usuario" placeholder="Tu correo electrónico">
                    <span id="error-usuario" class="error-texto"></span>
                </div>

                <div class="campo-formulario">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Crea una contraseña">
                    <span id="error-password" class="error-texto"></span>
                </div>

                <div class="campo-formulario">
                    <label for="repetir-password">Repetir Contraseña</label>
                    <input type="password" id="repetir-password" placeholder="Repite tu contraseña">
                    <span id="error-repetir-password" class="error-texto"></span>
                </div>

                <ul class="requisitos-password">
                    <li id="req-longitud" class="requisito"> * Entre 8 y 15 caracteres</li>
                    <li id="req-especial" class="requisito"> * Al menos un carácter especial (!@#$%...)</li>
                    <li id="req-mayuscula" class="requisito"> * Al menos una letra mayúscula</li>
                    <li id="req-coinciden" class="requisito"> *Ambas contraseñas coinciden</li>
                </ul>
                <button type="submit" class="btn-primario">Registrarse</button>
            </form>

            <nav class="enlaces-secundarios">
                <a href="index.html">¿Ya tienes cuenta? Inicia sesión aquí</a>
            </nav>
        </section>
    </main>
    <script type="module" src="js/registro.js"></script>
</body>

</html>
