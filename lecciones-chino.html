<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocablo - Lección de Chino</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/lecciones.css">
</head>

<body>


    <header class="cabecera-leccion">
        <nav class="nav-leccion">

            <a href="dashboard.html" class="btn-secundario" aria-label="Cerrar lección">✖ Salir</a>


            <div class="contenedor-progreso">
                <div class="progreso-actual" style="width: 50%;"></div> <!-- como se hace la barra de progreso?  -->
            </div>

            <span class="vidas-restantes" aria-label="3 vidas restantes">❤️ 3</span>
        </nav>
    </header>


    <main class="contenedor-principal-leccion">

        <section class="area-ejercicio">
            <h2>¿Cómo se dice "Manzana"?</h2>


            <form action="curso-chino.html" method="GET" class="formulario-leccion">


                <fieldset class="grupo-opciones">
                    <legend class="oculto-visual">Selecciona la traducción correcta</legend>

                    <label class="tarjeta-opcion">
                        <input type="radio" name="traduccion" value="chengzi" required>
                        <span class="texto-opcion">橙子</span>
                    </label>

                    <label class="tarjeta-opcion">
                        <input type="radio" name="traduccion" value="pingguo" required>
                        <span class="texto-opcion">苹果</span>
                    </label>

                    <label class="tarjeta-opcion">
                        <input type="radio" name="traduccion" value="xiangjiao" required>
                        <span class="texto-opcion">香蕉</span>
                    </label>
                </fieldset>


                <footer class="controles-leccion">
                    <button type="submit" class="btn-primario">Comprobar respuesta</button>
                </footer>
            </form>

        </section>

    </main>

</body>

</html>
